[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Blok akses publik ke source server-side & dokumen internal -- publish="."
# akan menyajikan /api, /lib, vercel.json, *.md sebagai file statis kalau
# tidak diblok di sini. Aturan ini tidak bentrok dengan route function
# (mis. /api/google/connect) karena route function tidak punya ekstensi file.
#
# CATATAN: Netlify splat (*) HARUS jadi elemen terakhir di path -- pola
# seperti "/api/*.js" atau "/*.md" (wildcard di tengah/sebelum suffix) TIDAK
# match sama sekali (sudah dicoba & terverifikasi gagal saat implementasi,
# filenya tetap ke-expose 200 tanpa 404). Makanya di bawah ini path server
# source & dokumen dienumerasi eksplisit, bukan pakai wildcard suffix.
[[redirects]]
  from = "/lib/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
